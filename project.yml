name: Autopiloto
options:
  bundleIdPrefix: com.alan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGN_STYLE: Automatic
    # Set your Apple Developer Team ID here (or pick the team in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: UK3KUGFP25
targets:
  Autopiloto:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alan.autopiloto
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "3"
        CODE_SIGN_ENTITLEMENTS: Autopiloto.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Autopiloto
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Autopiloto reads your workouts, weight and steps to close training blocks automatically and show your training week."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Autopiloto saves the weight you log so it shows up in Health and in your other apps."
        INFOPLIST_KEY_NSCameraUsageDescription: "Photograph a garment to add it to your closet."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pick a photo of a garment to add it to your closet."
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: [com.alan.autopiloto.rearm]
        UIBackgroundModes: [fetch]
    entitlements:
      path: Autopiloto.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.applesignin: [Default]
  AutopilotoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Autopiloto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alan.autopiloto.tests
schemes:
  Autopiloto:
    build:
      targets:
        Autopiloto: all
        AutopilotoTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Autopiloto.storekit
    test:
      config: Debug
      targets:
        - AutopilotoTests
