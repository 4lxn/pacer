name: Autopiloto
options:
  bundleIdPrefix: com.alan
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    CODE_SIGN_STYLE: Automatic
    # Xcode 26 compilation caching: unchanged files are not recompiled across clean builds / branches.
    COMPILATION_CACHE_ENABLE_CACHING: YES
    SWIFT_ENABLE_EXPLICIT_MODULES: YES
    # Set your Apple Developer Team ID here (or pick the team in Xcode > Signing & Capabilities).
    DEVELOPMENT_TEAM: UK3KUGFP25
targets:
  Autopiloto:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Assets.xcassets
      - path: Resources
      - path: Widget/WidgetViews.swift   # debug widget gallery renders the real widget views
      - path: Widget/PacerActivity.swift  # Live Activity attributes + intent, shared with the extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alan.autopiloto
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "14"
        CODE_SIGN_ENTITLEMENTS: Autopiloto.entitlements
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: Pacer
        INFOPLIST_KEY_NSHealthShareUsageDescription: "Pacer reads your workouts, weight and steps to close training blocks automatically and show your training week."
        INFOPLIST_KEY_NSHealthUpdateUsageDescription: "Pacer saves the weight you log so it shows up in Health and in your other apps."
        INFOPLIST_KEY_NSCameraUsageDescription: "Photograph a garment to add it to your closet."
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Pick a photo of a garment to add it to your closet."
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: "Pacer uses your location only when you tap 'Use my current location' to pin a place. It is never tracked or sent anywhere."
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
    dependencies:
      - target: AutopilotoWidget
        embed: true
    info:
      path: Info.plist
      properties:
        BGTaskSchedulerPermittedIdentifiers: [com.alan.autopiloto.rearm]
        UIBackgroundModes: [fetch]
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.alan.autopiloto
            CFBundleURLSchemes: [autopiloto]
    entitlements:
      path: Autopiloto.entitlements
      properties:
        com.apple.developer.usernotifications.time-sensitive: true
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        com.apple.developer.applesignin: [Default]
        com.apple.security.application-groups: [group.com.alan.autopiloto]
  AutopilotoWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget
      # Shared with the app: models + the JSON stores the widget reads.
      - path: Sources/Models/Block.swift
      - path: Sources/Models/BlockStatus.swift
      - path: Sources/Models/DayOverrides.swift
      - path: Sources/Models/DayTimeline.swift
      - path: Sources/Models/Place.swift
      - path: Sources/Models/WorkoutMatch.swift
      - path: Sources/Store/AppFiles.swift
      - path: Sources/Store/JSONFile.swift
      - path: Sources/Store/PlanStore.swift
      - path: Sources/Store/CompletionStore.swift
      - path: Sources/Store/DayStore.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alan.autopiloto.widget
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Pacer
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "14"
        CODE_SIGN_ENTITLEMENTS: AutopilotoWidget.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    info:
      path: Widget/Info.plist
      properties:
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: AutopilotoWidget.entitlements
      properties:
        com.apple.security.application-groups: [group.com.alan.autopiloto]
  AutopilotoTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Autopiloto
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.alan.autopiloto.tests
schemes:
  Autopiloto:
    build:
      targets:
        Autopiloto: all
        AutopilotoTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Autopiloto.storekit
    test:
      config: Debug
      targets:
        - AutopilotoTests
